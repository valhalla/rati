[package]
name = "rati"
version = "0.2.0"
edition = "2024"
rust-version = "1.94"
description = "Lightweight tile server for Valhalla graph tiles backed by S3, Azure Blob Storage, or a local tar archive"
readme = "README.md"
repository = "https://github.com/valhalla/rati"
license = "MIT OR Apache-2.0"
include = ["**/*.rs"]

[features]
default = ["s3", "azure"]
s3 = ["dep:aws-config", "dep:aws-sdk-s3"]
azure = ["dep:azure_core", "dep:azure_identity", "dep:azure_storage_blob"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[profile.release]
strip = true
lto = "thin"

[dependencies]
aws-config = { version = "1", default-features = false, features = ["rt-tokio", "default-https-client", "sso"], optional = true }
aws-sdk-s3 = { version = "1", default-features = false, features = ["rt-tokio", "default-https-client"], optional = true }
axum = "0.8"
azure_core = { version = "1.1.0", default-features = false, features = ["reqwest_rustls", "tokio"], optional = true }
azure_identity = { version = "1.0.0", default-features = false, optional = true }
azure_storage_blob = { version = "1.1.0", default-features = false, features = ["tokio"], optional = true }
bytes = "1"
clap = { version = "4.6", features = ["derive", "env"] }
flate2 = "1"
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
http-body = "1"
httpdate = "1.0.3"
rustc-hash = "2"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "signal"] }
tower-http = { version = "0.7", features = ["cors", "trace"] }
tracing = { version = "0.1", default-features = false }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "ansi"] }
zstd = { version = "0.13", default-features = false }
